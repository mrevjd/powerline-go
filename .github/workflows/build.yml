name: Build
on:
    pull_request: {}
    merge_group:
        types: [checks_requested]
    push: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build binaries
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # An incomplete go.mod/go.sum must not pass CI. `go mod tidy -diff` is the
      # check that actually detects it without mutating the tree.
      - name: Verify module graph is complete
        run: |
          set -euo pipefail
          # git diff cannot see an untracked file, so assert both are tracked
          # first: a go.sum missing from the repo would otherwise be regenerated
          # by the tooling below and still look clean.
          git ls-files --error-unmatch go.mod go.sum > /dev/null
          go mod download
          # `go mod download` + `git diff --exit-code` does NOT work as a
          # completeness check: -mod=readonly is the default, so download never
          # writes go.sum and that diff can never fire. Verified on 1.25 and 1.26
          # that a committed go.sum missing a direct dependency's h1: line, and a
          # committed go.mod missing an indirect require, both pass
          # download + diff + verify, and both are caught by tidy -diff.
          go mod tidy -diff
          go mod verify
      # Compiling the test files is what actually attests that the language
      # version go.mod declares is one the source builds and passes under, and
      # under the default -mod=readonly it also fails on a missing test-only sum.
      - run: go vet ./...
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: build --clean --snapshot
      - run: dist/powerline-go_linux_amd64_v1/powerline-go --help
